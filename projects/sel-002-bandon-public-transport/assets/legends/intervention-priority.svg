<text x="50" y="88" font-family="Arial,sans-serif" font-size="14" fill="#647181">SEL-002 · equity screening classes</text>
<rect x="50" y="130" width="120" height="60" rx="7" fill="#743C68" stroke="#B2B2B2"/><text x="50" y="220" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#07111F">Critical</text><rect x="215" y="130" width="120" height="60" rx="7" fill="#B26239" stroke="#B2B2B2"/><text x="215" y="220" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#07111F">High Concern</text><rect x="380" y="130" width="120" height="60" rx="7" fill="#D99A2B" stroke="#B2B2B2"/><text x="380" y="220" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#07111F">Concern</text><rect x="545" y="130" width="120" height="60" rx="7" fill="#D5BF71" stroke="#B2B2B2"/><text x="545" y="220" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#07111F">Emerging</text><rect x="710" y="130" width="120" height="60" rx="7" fill="#F9F6A1" stroke="#B2B2B2"/><text x="710" y="220" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#07111F">Neutral</text><text x="50" y="280" font-family="Arial,sans-serif" font-size="12" fill="#647181">Read alongside the accessibility and vulnerability layers; classes are analytical screening outputs.</text></svg>